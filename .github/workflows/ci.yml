name: CI
# full CI はリリース時だけ必須。main / PR では走らせない（main の軽い確認は main-health.yml）。
# release への昇格（scripts/release.mjs）が rc/<sha7> へ push してここを走らせ、
# release の ruleset がこの verify の成功を要求する。job 名 verify は ruleset と release.mjs が参照するので変えない。
on:
  push:
    branches: [release, 'rc/**']
  pull_request:
    branches: [release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    env:
      HUSKY: '0'
    runs-on: ubuntu-latest
    # The full suite takes ~22 min on a cold runner (Playwright deps alone ~7 min);
    # 25 cancelled a green run at its last step. Keep headroom, not a tight fit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run types
      - run: git diff --exit-code -- worker-configuration.d.ts
      - run: npm run build
      - run: npm test
      - run: npm run db:local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:pending-pilot
      - run: npm run test:retired-trial
      - run: npm run test:auth-browser
      - run: npm run editor:build
      - run: npm run test:editor
      - run: npm run deploy:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            test-results-generation/
          retention-days: 14
