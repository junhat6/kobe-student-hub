name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: git diff --exit-code -- worker-configuration.d.ts
      - run: npm run build
      - run: npm test
      - run: npm run db:local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:pending-pilot
      - run: npm run test:limited
      - run: npm run test:auth-browser
      - run: npm run editor:build
      - run: npm run test:editor
      - run: npm run deploy:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
