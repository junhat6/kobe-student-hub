name: main health
# main への push ごとの軽い確認。必須ではなく、壊れたら patrol ループが直すための合図。
# 重い E2E はここでは走らせず、リリース時の CI（verify）に任せる。
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-health
  cancel-in-progress: true
jobs:
  health:
    env:
      HUSKY: '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run types
      - run: git diff --exit-code -- worker-configuration.d.ts
      - run: npm run build
      - run: npm test
