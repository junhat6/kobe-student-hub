name: Release
# release ブランチが進んだら、その SHA にタグと GitHub Release を付け、本番へ deploy する。
# release へ入れるのは scripts/release.mjs だけ（ruleset が CI verify の成功を要求）。
# deploy は environment `production` に CLOUDFLARE_API_TOKEN があるときだけ動く。無い間は手元の
# `npm run release -- --deploy` が同じ scripts/deploy-production.mjs を実行する（docs/RELEASE.md）。
on:
  push:
    branches: [release]
  # token を足した後や失敗後に、release の先頭を deploy し直すため（scripts/release.mjs が使う）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-tag
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git tag --points-at "$SHA" | grep -q '^r'; then
            echo "already tagged"; exit 0
          fi
          day=$(TZ=Asia/Tokyo date +%Y.%m.%d)
          n=$(( $(git tag -l "r${day}.*" | wc -l) + 1 ))
          tag="r${day}.${n}"
          prev=$(git describe --tags --abbrev=0 --match 'r*' "$SHA^" 2>/dev/null || true)
          range=${prev:+$prev..}$SHA
          {
            echo "release \`${SHA:0:7}\`${prev:+ (前回 $prev から)}"
            echo
            git log --no-merges --format='- %s (%h)' "$range" | head -200
          } > notes.md
          git tag "$tag" "$SHA"
          git push origin "$tag"
          gh release create "$tag" --target "$SHA" --title "$tag" --notes-file notes.md

  deploy:
    needs: tag
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://hub.junhat6.com
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check deploy credential
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::environment production に CLOUDFLARE_API_TOKEN が無いので本番 deploy を飛ばします（手元の npm run release -- --deploy が担当）"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
          cache: npm
      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci
        env:
          HUSKY: '0'
      - if: steps.gate.outputs.enabled == 'true'
        run: npm run build
      - if: steps.gate.outputs.enabled == 'true'
        name: Deploy (migrations → deploy → smoke → rollback on failure)
        run: node scripts/deploy-production.mjs --sha "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KSH_PROD_D1_DATABASE_ID: ${{ secrets.KSH_PROD_D1_DATABASE_ID }}
          KSH_PROD_GOOGLE_CLIENT_ID: ${{ secrets.KSH_PROD_GOOGLE_CLIENT_ID }}
          KSH_PROD_MODERATION_EMAIL_TO: ${{ secrets.KSH_PROD_MODERATION_EMAIL_TO }}
